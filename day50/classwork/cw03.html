<!-- გამოიყენეთ document.body.innerHTML, რომ შეცვალოთ საიტი -->
<!DOCTYPE html>
<html>
<head>
    <title>Example</title>
</head>
<body>

<button onclick="changePage()">დააჭირე</button>

<script>
function changePage() {
    document.body.innerHTML = "<h1>ახალი გვერდი</h1><p>ეს ტექსტი შეიცვალა</p>";
}
</script>

</body>
</html>
