<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<title>CSS წრე ანიმაცია</title>
<style>
/* მთავარი კონტეინერი */
.loader {
  width: 100px;
  height: 100px;
  border: 12px solid #ccc;        /* ნეიტრალური ფონი */
  border-top: 12px solid #1e90ff; /* ანიმაციის ფერი */
  border-radius: 50%;             /* წრე */
  animation: spin 1s linear infinite; /* ტრიალი */
  margin: 50px auto;
}

/* ტრიალის ანიმაცია */
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>
<body>
  <div class="loader"></div>
</body>
</html>
